[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "healx"
version = "0.1.0"
description = "HealX — Autonomous AI Debugger powered by IBM Granite via watsonx.ai"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ibm-watsonx-ai",
    "pytest",
    "rich>=13",
    "typer>=0.9",
    "fastapi",
    "uvicorn[standard]",
    "sse-starlette",
]

[project.scripts]
heal-x = "healx_cli:app"

[tool.setuptools]
# This project is script-only — no importable package to discover.
py-modules = [
    "healx_cli",
    "orchestrator",
    "watsonx_client",
    "reporter",
    "app",
    "run_demo",
]
